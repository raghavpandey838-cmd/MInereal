<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minecraft Web Edition</title>
    <meta name="description" content="Authentic full-featured 3D voxel sandbox game featuring procedurally generated biomes, caves, survival & creative modes, mining, crafting, mobs, and day/night cycle." />
    <meta property="og:title" content="Minecraft Web Edition" />
    <meta property="og:description" content="Authentic full-featured 3D voxel sandbox game featuring procedurally generated biomes, caves, survival & creative modes, mining, crafting, mobs, and day/night cycle." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body style="margin:0;padding:0;background:#111111;color:#ffffff;overflow:hidden;width:100%;height:100%;" class="bg-black text-white overflow-hidden select-none">
    <div id="root">
      <!-- Loading state displayed before React finishes initial bundle evaluation -->
      <div id="mc-preloader" style="position:fixed;inset:0;background:#141414;color:#eeeeee;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;z-index:9999;">
        <div style="font-size:32px;font-weight:bold;letter-spacing:2px;color:#55ff55;text-shadow:2px 2px #000;margin-bottom:12px;">MINECRAFT</div>
        <div style="font-size:14px;color:#aaaaaa;margin-bottom:24px;">Loading voxel world...</div>
        <div style="width:200px;height:8px;background:#333;border-radius:4px;overflow:hidden;">
          <div style="width:60%;height:100%;background:#55ff55;animation:pulse 1.5s infinite;"></div>
        </div>
        <div id="mc-deploy-hint" style="display:none;margin-top:32px;max-width:480px;padding:16px;background:#241c1c;border:1px solid #ff5555;border-radius:6px;font-size:12px;color:#ffaaaa;line-height:1.6;text-align:left;">
          <strong>Deployment Notice:</strong> If this screen does not advance on GitHub Pages, make sure you enabled GitHub Actions under <em>Settings &rarr; Pages &rarr; Source: GitHub Actions</em> (or deployed the built <code>dist</code> directory rather than raw repository files).
        </div>
      </div>
    </div>
    <script>
      // If the module fails to mount within 6 seconds, show deployment hint to help users immediately
      setTimeout(function() {
        var hint = document.getElementById('mc-deploy-hint');
        if (hint && document.getElementById('mc-preloader')) {
          hint.style.display = 'block';
        }
      }, 5000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
